<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — EasyToReach WhatsApp CRM & Store Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ============================================================
       LOGIN PORTAL — LUXURY GLASSMORPHISM & CLEAN RESPONSIVENESS
       ============================================================ */
    body.login-body {
      background: var(--bg-body);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
      font-family: var(--font);
    }

    /* Ambient Background Orbs — WhatsApp Themed */
    .login-ambient-1 {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(0, 168, 132, 0.22), transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .login-ambient-2 {
      position: fixed;
      bottom: -100px;
      right: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37, 211, 102, 0.18), transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 14s ease-in-out infinite alternate-reverse;
    }

    .login-ambient-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    [data-theme="dark"] .login-ambient-1 {
      background: radial-gradient(circle, rgba(0, 168, 132, 0.28), transparent 70%);
    }

    [data-theme="dark"] .login-ambient-2 {
      background: radial-gradient(circle, rgba(37, 211, 102, 0.22), transparent 70%);
    }

    [data-theme="dark"] .login-ambient-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1.5px, transparent 1.5px);
      opacity: 0.55;
    }

    /* Top Navigation bar */
    .login-topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .login-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s var(--ease);
    }

    .login-back-link:hover {
      color: var(--accent-600);
      border-color: var(--accent-400);
      transform: translateX(-3px);
    }

    /* Main Container Card */
    .login-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 44px 38px 36px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.12), 0 0 30px rgba(0, 168, 132, 0.1);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: modalFadeIn 0.5s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    [data-theme="dark"] .login-container {
      background: rgba(32, 44, 51, 0.92);
      border: 1px solid rgba(0, 168, 132, 0.35);
      box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 168, 132, 0.25);
    }

    /* Brand Header */
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo-bubble {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, #008069, #00a884);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 8px 24px rgba(0, 168, 132, 0.4);
      margin-bottom: 16px;
      animation: floatBadge 4s ease-in-out infinite alternate;
    }

    .login-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: -0.6px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Role Switcher Pill Tabs */
    .role-tabs {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 4px;
      margin-bottom: 24px;
      position: relative;
    }

    .role-tab {
      flex: 1;
      padding: 10px 14px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      border: none;
      background: transparent;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.25s var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      outline: none;
    }

    .role-tab.active {
      background: var(--bg-card);
      color: var(--primary-600);
      box-shadow: var(--shadow-sm);
    }

    [data-theme="dark"] .role-tab.active {
      background: var(--accent-600);
      color: #ffffff;
    }

    /* Input Fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 0.95rem;
      color: var(--text-heading);
      font-family: inherit;
      transition: all 0.25s var(--ease);
      outline: none;
      box-sizing: border-box;
    }

    .form-input:focus {
      border-color: var(--accent-500);
      box-shadow: 0 0 0 4px rgba(0, 168, 132, 0.2);
    }

    .form-input:focus + .input-icon {
      color: var(--accent-500);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: var(--text-heading);
    }

    /* Error Message Alert */
    .login-alert {
      display: none;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      animation: shakeAlert 0.4s ease;
    }

    @keyframes shakeAlert {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Action Buttons */
    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #00a884, #008069);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 24px rgba(0, 168, 132, 0.35);
      transition: all 0.25s var(--ease);
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 168, 132, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .login-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--accent-500);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="login-body" id="loginBody">

  <!-- Ambient Light Orbs & Grid -->
  <div class="login-ambient-1"></div>
  <div class="login-ambient-2"></div>
  <div class="login-ambient-grid"></div>

  <!-- Top bar -->
  <header class="login-topbar">
    <a href="/" class="login-back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="LoginPortal.toggleTheme()" title="Toggle Dark/Light Mode">
      <span class="theme-icon-box"><i class="fa-solid fa-moon" id="themeIcon"></i></span>
      <span class="theme-label" id="themeLabel">Dark</span>
    </button>
  </header>

  <!-- Login Card Container -->
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo-bubble">
        <i class="fa-brands fa-whatsapp" style="font-size:2rem; color:#fff;"></i>
      </div>
      <h1 class="login-title">EasyToReach Portal</h1>
      <p class="login-subtitle" id="roleSubtitle">Sign in to access your showroom's private WhatsApp CRM & billing dashboard.</p>
    </div>

    <!-- Role Switcher -->
    <div class="role-tabs">
      <button class="role-tab active" id="tabShopOwner" onclick="LoginPortal.setRole('shop_owner')">
        <i class="fa-solid fa-store"></i> Shop Owner
      </button>
      <button class="role-tab" id="tabAdmin" onclick="LoginPortal.setRole('admin')">
        <i class="fa-solid fa-crown"></i> Platform Admin
      </button>
    </div>

    <!-- Error Alert Banner -->
    <div class="login-alert" id="loginAlert">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="loginAlertText">Invalid username or password</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="LoginPortal.handleSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="usernameInput">Username or Email</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="usernameInput" 
            class="form-input" 
            placeholder="e.g. lakshmi or admin" 
            required 
            autocomplete="username"
          >
          <i class="fa-solid fa-user input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <label class="form-label" for="passwordInput" style="margin-bottom:0;">Password</label>
          <span style="font-size:0.75rem; color:var(--text-muted); cursor:pointer;" onclick="LoginPortal.showHelp()">Forgot?</span>
        </div>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
          <i class="fa-solid fa-lock input-icon"></i>
          <button type="button" class="password-toggle" onclick="LoginPortal.togglePasswordVisibility()" title="Show/Hide Password">
            <i class="fa-solid fa-eye" id="passwordToggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard</span>
        <i class="fa-solid fa-circle-notch fa-spin" id="btnSpinner" style="display:none;"></i>
      </button>
    </form>

    <div class="login-footer">
      <span>Need your textile showroom registered? <a href="mailto:admin@easytoreach.in">Contact Platform Support</a></span>
    </div>
  </div>

  <script>
    // Login Portal Client Controller
    const LoginPortal = {
      currentTheme: 'light',
      selectedRole: 'shop_owner',

      init() {
        // Theme init
        const savedTheme = localStorage.getItem("textile_theme") || 
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        this.applyTheme(savedTheme);

        // If already authenticated, redirect to dashboard directly
        const token = localStorage.getItem("textile_token");
        if (token) {
          fetch("/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
          })
          .then(res => res.json())
          .then(data => {
            if (data.authenticated) {
              window.location.href = "/dashboard";
            }
          })
          .catch(() => {});
        }
      },

      setRole(role) {
        this.selectedRole = role;
        document.getElementById("tabShopOwner").classList.toggle("active", role === 'shop_owner');
        document.getElementById("tabAdmin").classList.toggle("active", role === 'admin');

        const subtitle = document.getElementById("roleSubtitle");
        if (role === 'admin') {
          subtitle.textContent = "Sign in with platform master credentials to manage all textile stores and users.";
        } else {
          subtitle.textContent = "Sign in to access your showroom's private WhatsApp CRM & billing dashboard.";
        }
      },

      togglePasswordVisibility() {
        const input = document.getElementById("passwordInput");
        const icon = document.getElementById("passwordToggleIcon");
        if (input.type === "password") {
          input.type = "text";
          icon.className = "fa-solid fa-eye-slash";
        } else {
          input.type = "password";
          icon.className = "fa-solid fa-eye";
        }
      },

      showHelp() {
        alert("For security, shop owner passwords are provided by the Platform Admin. Contact admin@easytoreach.in to reset credentials.");
      },

      async handleSubmit(e) {
        if (e) e.preventDefault();
        const alertBox = document.getElementById("loginAlert");
        const alertText = document.getElementById("loginAlertText");
        const btnText = document.getElementById("btnText");
        const btnSpinner = document.getElementById("btnSpinner");
        const submitBtn = document.getElementById("submitBtn");

        alertBox.style.display = "none";
        const username = document.getElementById("usernameInput").value.trim();
        const password = document.getElementById("passwordInput").value;

        if (!username || !password) {
          alertText.textContent = "Please enter both username and password.";
          alertBox.style.display = "flex";
          return;
        }

        // Show loading state
        btnText.style.display = "none";
        btnSpinner.style.display = "inline-block";
        submitBtn.disabled = true;

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (data.success) {
            // Save token and user details to localStorage
            localStorage.setItem("textile_token", data.token);
            localStorage.setItem("textile_user", JSON.stringify(data.user));
            if (data.user.shop_id) {
              localStorage.setItem("textile_active_shop", data.user.shop_id);
            }

            // Animate transition to dashboard
            document.querySelector(".login-container").style.transform = "scale(0.95)";
            document.querySelector(".login-container").style.opacity = "0.7";
            setTimeout(() => {
              window.location.href = "/dashboard";
            }, 300);
          } else {
            alertText.textContent = data.error || "Invalid username or password.";
            alertBox.style.display = "flex";
            btnText.style.display = "inline-block";
            btnSpinner.style.display = "none";
            submitBtn.disabled = false;
          }
        } catch (err) {
          alertText.textContent = "Connection error. Please ensure server is running.";
          alertBox.style.display = "flex";
          btnText.style.display = "inline-block";
          btnSpinner.style.display = "none";
          submitBtn.disabled = false;
        }
      },

      toggleTheme() {
        const nextTheme = this.currentTheme === 'dark' ? 'light' : 'dark';
        const icon = document.getElementById("themeIcon");
        if (icon) {
          icon.classList.remove("icon-spin");
          void icon.offsetWidth;
          icon.classList.add("icon-spin");
        }
        this.applyTheme(nextTheme);
      },

      applyTheme(theme) {
        this.currentTheme = theme;
        document.documentElement.setAttribute("data-theme", theme);
        document.body.setAttribute("data-theme", theme);
        localStorage.setItem("textile_theme", theme);

        const icon = document.getElementById("themeIcon");
        const label = document.getElementById("themeLabel");
        if (icon) {
          icon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }
        if (label) {
          label.textContent = theme === "dark" ? "Light" : "Dark";
        }
      }
    };

    document.addEventListener("DOMContentLoaded", () => LoginPortal.init());
  </script>
</body>
</html>
